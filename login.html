<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="icon" type="image/png" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/login.css">
  <script type="module" src="/javascript/firebaseauth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
  <script type="module" src="/javascript/firebaseinit.js"></script>
</head>
<body>
  <header>
    <div class="logo">Aid<span>Bridge</span></div>
    <nav>
      <a href="#" class="active">Log In</a>
      <a href="/signup.html" class="signup">Sign Up</a>
    </nav>
  </header>

  <main>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email address" required>

        <label for="password">Password</label>
<div class="password-container">
  <input type="password" id="password" placeholder="Enter your password." required minlength="10"/>
  <span id="togglePassword" class="toggle-password">👁️</span>
</div>
      

      <button type="submit">Log In</button>
      <a href="#" class="forgot">Forgot password</a>

    </form>
  </main>

  <footer>
    <p>© 2025 AidBridge Corporation. All Rights Reserved.</p>
    <div class="footer-links">
      <a href="About-Us.html">About</a>
      <a href="Blog.html">Blog</a>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
    </div>
  </footer>

  <script>
  const passwordInput = document.getElementById('password');
  const toggle = document.getElementById('togglePassword');

  toggle.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggle.textContent = isPassword ? '👁️‍🗨️' : '👁️';
  });
</script>

</body>
</html>
