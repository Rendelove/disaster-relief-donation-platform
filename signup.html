<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="icon" type="image/png" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/signup.css" />
  <script type="module" src="/javascript/firebaseauth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
  <script type="module" src="/javascript/firebaseinit.js"></script>
</head>
<body>
  <header>
    <div class="logo">Aid<span>Bridge</span></div>
    <nav>
      <a href="/login.html">Log In</a>
      <a href="#" class="active">Sign Up</a>
    </nav>
  </header>

  <main class="signup-container">
    <section class="form-section">
      <h1>Sign Up</h1>
      <form id="signup-form">
        <div class="name-fields">
          <div>
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" placeholder="Your first name" required />
          </div>
          <div>
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" placeholder="Your last name" required />
          </div>
        </div>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Your email address" required />

        <label for="password">Create Password</label>
<div class="password-container">
  <input type="password" id="password" placeholder="Must be at least 10 characters." required minlength="10"/>
  <span id="togglePassword" class="toggle-password">👁️</span>
</div>


        <button type="submit">Register</button>
      </form>
    </section>

    <section class="side-section">
      <h2>Get access to thousands of items and relief funds after a disaster.</h2>
      <img src="/assets/carl-kho-TdkUrQbNRCE-unsplash.jpg" alt="Chicago workspace" />
    </section>
  </main>

  <script>
  const passwordInput = document.getElementById('password');
  const toggle = document.getElementById('togglePassword');

  toggle.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggle.textContent = isPassword ? '👁️‍🗨️' : '👁️';
  });
</script>

</body>
</html>
